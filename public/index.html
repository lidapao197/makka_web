<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Makkah导航 — 基于历史数据目录重新设计的极简影视导航站">
<title>Makkah导航</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="shell topbar-inner">
    <a class="brand" href="/" aria-label="Makkah导航首页">
      <span class="brand-mark">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12.296 3.464 3.02 3.956"/><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3z"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m6.18 5.276 3.1 3.899"/></svg>
      </span>
      <span class="brand-text"><strong>Makkah导航</strong><small>MAKKAH / MEDIA INDEX</small></span>
    </a>

    <div class="search-wrap">
      <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="搜索 TMDB 影片 / 剧集…" autocomplete="off" aria-label="搜索 TMDB 资源">
      <button id="searchClear" class="search-clear" hidden aria-label="清空搜索">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <kbd>Ctrl K</kbd>
    </div>

    <div class="topbar-actions">
      <button id="sourceBadge" class="source-badge" title="查看数据来源"><span class="dot"></span><span id="sourceText">连接中</span></button>
      <button id="favBtn" class="fav-btn" type="button" aria-pressed="false" title="我的收藏">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
        <span>收藏</span>
        <span class="fav-count" id="favCount">0</span>
      </button>
      <button id="themeBtn" class="icon-btn" aria-label="切换到日间模式">
        <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      </button>
      <a class="text-link" href="#" id="aboutBtn">关于</a>
    </div>
  </div>
</header>

<main>
  <section class="shell browse">
    <div class="tabs" id="tabs" role="tablist" aria-label="栏目切换"></div>
    <div class="quick-row" id="quickRow" aria-label="快捷榜单"></div>
  </section>

  <div class="shell" id="filterWrap">
    <section class="filter-bar" aria-label="影视筛选">
      <div class="filter-grid" id="filterGrid"></div>
      <div class="filter-foot">
        <span class="filter-meta" id="resultMeta">正在载入栏目…</span>
        <button class="reset-btn" id="resetBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          重置筛选
        </button>
      </div>
    </section>
  </div>

  <section class="shell library">
    <div class="library-head">
      <div><span class="eyebrow">Library</span><h2 id="libraryTitle">全部影视</h2></div>
      <span class="library-note" id="libraryNote">点击卡片查看详情</span>
    </div>
    <div class="fav-toolbar" id="favToolbar" hidden>
      <span class="fav-hint">收藏仅保存在当前浏览器，可导出 JSON 备份或导入到其它设备</span>
      <button type="button" class="tool-btn" id="favExport">导出 JSON</button>
      <button type="button" class="tool-btn" id="favImport">导入 JSON</button>
      <button type="button" class="tool-btn tool-btn--danger" id="favClear">清空收藏</button>
      <input type="file" id="favFile" accept="application/json,.json" hidden>
    </div>
    <div class="grid" id="grid"></div>
    <div class="pager" id="pager"></div>
  </section>
</main>

<footer class="footer">
  <div class="shell footer-inner">
    <span>© 2026 Makkah导航 · 栏目与筛选定义源自 <code>lib/</code> 历史数据目录</span>
    <span>本站仅做信息展示与第三方跳转，不存储、不播放视频内容；收藏仅保存影片元数据于本地浏览器。</span>
  </div>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="详情弹层">
  <div class="modal-card" id="modalCard"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="/js/app.js" defer></script>
</body>
</html>
